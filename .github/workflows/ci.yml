name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out moxer-icons-clean.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: moxer-icons-clean-vsix
          path: moxer-icons-clean.vsix
          if-no-files-found: error