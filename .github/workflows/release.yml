name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out moxer-icons-clean.vsix

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --yes \
            --package semantic-release \
            --package @semantic-release/github \
            --package @semantic-release/commit-analyzer \
            --package @semantic-release/release-notes-generator \
            semantic-release
